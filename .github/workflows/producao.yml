name: Cozinhando a Produção

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/mmtr-se/do-quintal-a-cozinha-cms
  APP_IMAGE: ghcr.io/mmtr-se/do-quintal-a-cozinha

jobs:
  cozinhando:
    name: Cozinhando e publicando a imagem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Sincronizando repositorio
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparando cache
        uses: actions/cache@v4
        with:
         path: |
           ~/.npm
           ${{ github.workspace }}/.next/cache
         key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
         restore-keys: |
           ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: Cozinhando (npm install & build)
        run: |
          npm install --omit=dev
          npm run build --if-present
        env:
          GROQ_API_KEY: "some-key"

      - name: Preparando Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticando no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construindo e publicando o Strapi CMS
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/cms/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:producao
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=pre-producao-cms
          cache-to: type=gha,mode=max,scope=pre-producao-cms

      - name: Construindo e publicando a aplicacao
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/producao/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_STRAPI_URL=https://conteudos.mulheresrurais.com.br
          tags: |
            ${{ env.APP_IMAGE }}:producao
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=producao-app
          cache-to: type=gha,mode=max,scope=producao-app

  deploy:
    name: Servindo em produção
    environment: Producao
    needs: cozinhando
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Servindo o cozido
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_PATH: ${{ vars.PROD_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 30m
          envs: GHCR_USERNAME,GHCR_TOKEN,PROD_PATH
          script: |
            set -eu

            cd "$PROD_PATH"

            available_kb="$(df --output=avail / | tail -n 1 | tr -d ' ')"
            if [ "$available_kb" -lt 5242880 ]; then
              echo "Pouco espaço em disco; removendo apenas caches e imagens Docker sem uso."
              df -h /
              docker builder prune --all --force
              docker image prune --all --force
              df -h /
            fi

            git checkout main
            git pull --rebase novo main

            ensure_secret() {
              key="$1"
              if ! grep -q "^${key}=" .env; then
                printf '%s=%s\n' "$key" "$(openssl rand -hex 32)" >> .env
              fi
            }
            if ! grep -q '^CMS_APP_KEYS=' .env; then
              printf 'CMS_APP_KEYS=%s,%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" >> .env
            fi
            ensure_secret CMS_API_TOKEN_SALT
            ensure_secret CMS_ADMIN_JWT_SECRET
            ensure_secret CMS_TRANSFER_TOKEN_SALT
            ensure_secret CMS_JWT_SECRET
            ensure_secret CMS_ENCRYPTION_KEY
            ensure_secret API_KEY

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            cd ../caddy
            # A imagem vem pronta do GHCR (construida no runner): a VPS so baixa.
            docker compose pull quintal-cms
            docker compose up -d --no-build quintal-cms

            docker compose pull quintal
            docker compose up -d --no-build quintal

            # O volume do Postgres sobe vazio na primeira vez: aplica as
            # migracoes antes de considerar o deploy bom (sem isso o site sobe
            # sem tabelas e responde 500). Idempotente nas proximas.
            if docker compose exec -T quintal test -f node_modules/prisma/build/index.js; then
              docker compose exec -T quintal node node_modules/prisma/build/index.js migrate deploy
            else
              docker compose exec -T quintal npx --yes prisma@6.18.0 migrate deploy
            fi

      - name: Verificando a publicação
        run: |
          ok=0
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:83/; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != 1 ]; then
            echo "site nao respondeu apos o deploy"
            docker compose logs --no-color --tail 60 quintal || true
            exit 1
          fi
