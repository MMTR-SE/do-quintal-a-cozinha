name: Cozinhando a Pre-Produção

on:
  push:
    branches:
      - pre-producao
  workflow_dispatch:

jobs:
  cozinhando:
    name: Cozinhando para testar (build)
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizando repositorio
        uses: actions/checkout@v4
        with:
          ref: pre-producao
      - name: Preparando cache
        uses: actions/cache@v4
        with:
         path: |
           ~/.npm
           ${{ github.workspace }}/.next/cache
         key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
         restore-keys: |
           ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: Cozinhando (npm install & build)
        run: |
          npm install --omit=dev
          npm run build --if-present
          npm ci --prefix cms
          npm run build --prefix cms
        env:
          GROQ_API_KEY: "some-key"
  deploy:
    name: Servindo para testar
    environment: Pre-Producao
    needs: cozinhando
    runs-on: ubuntu-latest
    steps:
      - name: Servindo o cozido
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd $DEV_PATH
            git checkout pre-producao
            git pull --rebase novo pre-producao

            touch .env
            ensure_secret() {
              key="$1"
              if ! grep -q "^${key}=" .env; then
                printf '%s=%s\n' "$key" "$(openssl rand -hex 32)" >> .env
              fi
            }
            if ! grep -q '^CMS_APP_KEYS=' .env; then
              printf 'CMS_APP_KEYS=%s,%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" >> .env
            fi
            ensure_secret CMS_API_TOKEN_SALT
            ensure_secret CMS_ADMIN_JWT_SECRET
            ensure_secret CMS_TRANSFER_TOKEN_SALT
            ensure_secret CMS_JWT_SECRET
            ensure_secret CMS_ENCRYPTION_KEY

            cd ../caddy
            if [ ! -f Caddyfile ]; then
              echo "Caddyfile não encontrado em $(pwd)" >&2
              exit 1
            fi
            if ! grep -qF 'conteudo.{$DOMAIN}' Caddyfile; then
              printf '\nconteudo.mulheresrurais-se.com.br,\nconteudo.{$DOMAIN} {\n\treverse_proxy pre-quintal-cms:1337\n}\n' >> Caddyfile
            fi
            docker compose up -d --build pre-quintal
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
