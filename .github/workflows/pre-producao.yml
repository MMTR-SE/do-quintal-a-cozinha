name: Cozinhando a Pre-Produção

on:
  push:
    branches:
      - pre-producao
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/mmtr-se/do-quintal-a-cozinha-cms
  APP_IMAGE: ghcr.io/mmtr-se/do-quintal-a-cozinha

jobs:
  cozinhando:
    name: Cozinhando e publicando imagens
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Sincronizando repositorio
        uses: actions/checkout@v4
        with:
          ref: pre-producao
      - name: Preparando cache
        uses: actions/cache@v4
        with:
         path: |
           ~/.npm
           ${{ github.workspace }}/.next/cache
         key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
         restore-keys: |
           ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: Cozinhando (npm install & build)
        run: |
          npm install --omit=dev
          npm run build --if-present
        env:
          GROQ_API_KEY: "some-key"

      - name: Preparando Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticando no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construindo e publicando o Strapi CMS
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/cms/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:pre-producao
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=pre-producao-cms
          cache-to: type=gha,mode=max,scope=pre-producao-cms

      # A VPS tem 1.9 GB de RAM e o `next build` la dentro derrubava a maquina
      # (swap cheio, load ~100). Agora a imagem da aplicacao sai pronta daqui.
      - name: Construindo e publicando a aplicacao
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pre-producao/Dockerfile
          push: true
          build-args: |
            # O Next embute esta URL no bundle: e assim que o site encontra o CMS
            # de pre-producao (leitura via cms-sync e escrita via site-to-cms).
            NEXT_PUBLIC_STRAPI_URL=https://conteudos-dev.mulheresrurais.com.br
          tags: |
            ${{ env.APP_IMAGE }}:pre-producao
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=pre-producao-app
          cache-to: type=gha,mode=max,scope=pre-producao-app

  deploy:
    name: Servindo para testar
    environment: Pre-Producao
    needs: cozinhando
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Servindo o cozido
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # O build da imagem na VPS passava de 10 min; o padrao do passo
          # cortava o deploy no meio.
          command_timeout: 30m
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu

            cd $DEV_PATH

            available_kb="$(df --output=avail / | tail -n 1 | tr -d ' ')"
            if [ "$available_kb" -lt 5242880 ]; then
              echo "Pouco espaço em disco; removendo apenas caches e imagens Docker sem uso."
              df -h /
              docker builder prune --all --force
              docker image prune --all --force
              df -h /
            fi

            git checkout pre-producao

            # A VPS tinha uma alteracao manual neste arquivo, impedindo o pull.
            # Preserva uma copia recuperavel antes de restaurar a versao do Git.
            if ! git diff --quiet -- docker/cms/Dockerfile; then
              backup_file="/tmp/do-quintal-cms-Dockerfile.$(date +%Y%m%d%H%M%S)"
              cp docker/cms/Dockerfile "$backup_file"
              echo "Backup da alteracao local salvo em $backup_file"
              git restore -- docker/cms/Dockerfile
            fi

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "O checkout de deploy ainda possui alteracoes locais:" >&2
              git status --short >&2
              exit 1
            fi

            git pull --rebase novo pre-producao

            if [ ! -e .env ]; then
              install -m 0644 /dev/null .env
            else
              chmod 0644 .env
            fi
            ensure_secret() {
              key="$1"
              if ! grep -q "^${key}=" .env; then
                printf '%s=%s\n' "$key" "$(openssl rand -hex 32)" >> .env
              fi
            }
            if ! grep -q '^CMS_APP_KEYS=' .env; then
              printf 'CMS_APP_KEYS=%s,%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" >> .env
            fi
            ensure_secret CMS_API_TOKEN_SALT
            ensure_secret CMS_ADMIN_JWT_SECRET
            ensure_secret CMS_TRANSFER_TOKEN_SALT
            ensure_secret CMS_JWT_SECRET
            ensure_secret CMS_ENCRYPTION_KEY
            # Chave das rotas /api/* (middleware do site). Sem ela a API inteira
            # responde 401 -- inclusive o POST /api/cms-sync que o CMS usa para
            # publicar no Postgres e as rotas que o Typebot chama. O CMS le a
            # mesma chave deste arquivo, entao os dois lados combinam sozinhos.
            ensure_secret API_KEY

            # --- Typebot de pre-producao (teste dos fluxos) ----------------------
            # O login do Typebot e sempre por codigo enviado por e-mail: quem recebe
            # esses codigos e o Mailpit interno. A caixa de entrada sai em
            # https://typebot-dev.mulheresrurais.com.br/mailpit, protegida por senha.
            ensure_secret MAILPIT_PASSWORD
            if ! grep -q '^MAILPIT_USER=' .env; then
              printf 'MAILPIT_USER=quintal\n' >> .env
            fi
            # O Typebot exige ENCRYPTION_SECRET com exatamente 32 caracteres.
            if ! grep -qE '^ENCRYPTION_SECRET=.{32}$' .env; then
              sed -i '/^ENCRYPTION_SECRET=/d' .env
              printf 'ENCRYPTION_SECRET=%s\n' "$(openssl rand -hex 16)" >> .env
            fi
            # Com ADMIN_EMAIL definido, o cadastro fica fechado nele.
            if grep -qE '^ADMIN_EMAIL=.+@' .env && ! grep -q '^DISABLE_SIGNUP=' .env; then
              printf 'DISABLE_SIGNUP=true\n' >> .env
            fi

            cd ../caddy
            if [ ! -f Caddyfile ]; then
              echo "Caddyfile não encontrado em $(pwd)" >&2
              exit 1
            fi
            # O Caddyfile é um bind mount de arquivo único: `sed -i` falha com
            # "Resource busy", então os blocos são acrescentados por `cat >>`.
            # O backup permite voltar atrás se o arquivo ficar inválido.
            cp Caddyfile /tmp/Caddyfile.do-quintal.bak
            # O domínio antigo do CMS continua de propósito: o container do CMS é o
            # mesmo e a aplicação de produção aponta para essa URL.
            if ! grep -qF 'conteudos.mulheresrurais.com.br {' Caddyfile; then
              printf '\nconteudos.mulheresrurais.com.br {\n\treverse_proxy pre-quintal-cms:1337\n}\n' \
                | docker compose exec -T --user root caddy sh -c 'cat >> /etc/caddy/Caddyfile'
            fi
            # Endereço próprio do CMS de pré-produção.
            if ! grep -qF 'conteudos-dev.mulheresrurais.com.br {' Caddyfile; then
              printf '\nconteudos-dev.mulheresrurais.com.br {\n\treverse_proxy pre-quintal-cms:1337\n}\n' \
                | docker compose exec -T --user root caddy sh -c 'cat >> /etc/caddy/Caddyfile'
            fi
            # Builder do Typebot em typebot-dev, com o Mailpit (código de login) em
            # /mailpit protegido por HTTP basic auth.
            if ! grep -qF 'pre-quintal-typebot-builder:3000' Caddyfile; then
              MAILPIT_USER_VALUE="$(grep -m1 '^MAILPIT_USER=' $DEV_PATH/.env | cut -d= -f2-)"
              MAILPIT_PASSWORD_VALUE="$(grep -m1 '^MAILPIT_PASSWORD=' $DEV_PATH/.env | cut -d= -f2-)"
              MAILPIT_HASH="$(docker compose exec -T caddy caddy hash-password --plaintext "$MAILPIT_PASSWORD_VALUE" | tr -d '\r\n')"
              printf '\ntypebot-dev.mulheresrurais.com.br {\n\thandle /mailpit* {\n\t\tbasic_auth {\n\t\t\t%s %s\n\t\t}\n\t\treverse_proxy pre-quintal-mailpit:8025\n\t}\n\thandle {\n\t\treverse_proxy pre-quintal-typebot-builder:3000\n\t}\n}\n' \
                "${MAILPIT_USER_VALUE:-quintal}" "$MAILPIT_HASH" \
                | docker compose exec -T --user root caddy sh -c 'cat >> /etc/caddy/Caddyfile'
            fi
            # Viewer do Typebot (é este endereço que aparece dentro dos fluxos).
            if ! grep -qF 'pre-quintal-typebot-viewer:3000' Caddyfile; then
              printf '\nbot-dev.mulheresrurais.com.br {\n\treverse_proxy pre-quintal-typebot-viewer:3000\n}\n' \
                | docker compose exec -T --user root caddy sh -c 'cat >> /etc/caddy/Caddyfile'
            fi

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            # Banco do Typebot dentro do Postgres da pre-producao (idempotente).
            docker exec -i pre-quintal-postgres sh -s <<'EOSQL'
            if psql -U "$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='typebot'" | grep -q 1; then
              echo "Banco typebot ja existe."
            else
              psql -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE typebot OWNER $POSTGRES_USER;"
              echo "Banco typebot criado."
            fi
            EOSQL

            docker compose pull pre-quintal-cms
            docker compose up -d --no-build pre-quintal-cms
            # A imagem da aplicacao vem pronta do GHCR (construida no runner).
            docker compose pull pre-quintal
            docker compose up -d --no-build --no-deps pre-quintal

            # Typebot de teste + Mailpit. Usam as mesmas imagens do Typebot de
            # producao (que ja estao na VPS) e os limites de memoria definidos no
            # compose para nao derrubarem o Caddy nem o Typebot de producao.
            echo "Memoria antes de subir o Typebot de teste:"; free -m || true
            docker compose up -d --no-build \
              pre-quintal-mailpit \
              pre-quintal-typebot-redis \
              pre-quintal-typebot-builder \
              pre-quintal-typebot-viewer

            # Só recarrega o Caddy depois de validar: um Caddyfile inválido
            # derrubaria todos os sites da VPS. Se estiver inválido, volta o
            # arquivo anterior (o Caddy segue com a config que já está em memória).
            if docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
              docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            else
              echo "Caddyfile inválido: restaurando a versão anterior." >&2
              cp /tmp/Caddyfile.do-quintal.bak Caddyfile
              exit 1
            fi
            echo "Memoria depois de subir o Typebot de teste:"; free -m || true

      - name: Verificando a publicação
        run: |
          for attempt in $(seq 1 18); do
            if curl --silent --show-error --output /dev/null --location --max-time 15 \
              https://conteudos.mulheresrurais.com.br/; then
              exit 0
            fi
            echo "Aguardando HTTPS ficar disponível (tentativa ${attempt}/18)..."
            sleep 10
          done
          echo "A publicação não respondeu via HTTPS." >&2
          exit 1

      - name: Conferindo CMS e Typebot de pré-produção (informativo)
        # Não derruba o deploy: o site e o CMS antigos já estão no ar e o Typebot
        # pode ainda estar emitindo o certificado do domínio novo.
        continue-on-error: true
        run: |
          for url in \
            https://conteudos-dev.mulheresrurais.com.br/_health \
            https://typebot-dev.mulheresrurais.com.br/ \
            https://bot-dev.mulheresrurais.com.br/ \
            https://typebot-dev.mulheresrurais.com.br/mailpit/
          do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --location --max-time 20 "$url" || true)"
            echo "${url} -> HTTP ${code:-sem resposta}"
          done
