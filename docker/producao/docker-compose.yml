services:
  quintal:
    container_name: quintal
    build:
      context: $PROD_PATH
      dockerfile: $PROD_PATH/docker/producao/Dockerfile
      args:
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL}
    env_file:
      - $PROD_PATH/.env
    environment:
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-quintal}:${POSTGRES_PASSWORD:-quintal}@postgres:5432/${POSTGRES_DB:-quintal}?schema=public
    ports:
      - "83:3000"
    restart: unless-stopped
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - $PROD_PATH/prisma:/app/prisma

  postgres:
    container_name: quintal-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - $PROD_PATH/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - app_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quintal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quintal}
      POSTGRES_DB: ${POSTGRES_DB:-quintal}
      TZ: ${TZ:-America/Maceio}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quintal} -d ${POSTGRES_DB:-quintal}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
