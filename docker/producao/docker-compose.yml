services:
  quintal:
    container_name: quintal
    build:
      context: $PROD_PATH
      dockerfile: $PROD_PATH/docker/producao/Dockerfile
      args:
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL}
    env_file:
      - $PROD_PATH/.env
    environment:
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL}
    ports:
      - "83:3000"
    restart: unless-stopped
    networks:
      - app_network
    volumes:
      - $PROD_PATH/prisma:/app/prisma

networks:
  app_network:
    driver: bridge
