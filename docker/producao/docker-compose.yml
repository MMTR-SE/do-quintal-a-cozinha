services:
  quintal:
    container_name: quintal
    # A imagem e construida no runner do GitHub e publicada no GHCR. 
    # O bloco `build` fica para quem quiser construir na mao.
    image: ghcr.io/mmtr-se/do-quintal-a-cozinha:producao
    build:
      context: $PROD_PATH
      dockerfile: $PROD_PATH/docker/producao/Dockerfile
    # Todo o ambiente da aplicacao vem deste arquivo: e a unica fonte de
    # verdade (DATABASE_URL, API_KEY, STRAPI_API_TOKEN, NEXT_PUBLIC_STRAPI_URL,
    # CMS_*). Nao repetir essas variaveis em `environment:` -- variavel
    # interpolada cujo valor nao esteja no .env do projeto chega VAZIA e
    # sobrepoe o que veio do env_file.
    env_file:
      - $PROD_PATH/.env

    ports:
      - "83:3000"
    restart: unless-stopped
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - $PROD_PATH/prisma:/app/prisma

  postgres:
    container_name: quintal-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - $PROD_PATH/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - app_network
    # Usa o mesmo .env do site: a senha do banco precisa bater com o
    # DATABASE_URL de la. O entrypoint so le estas variaveis na primeira
    # inicializacao do volume -- depois, trocar a senha exige ALTER ROLE.
    env_file:
      - $PROD_PATH/.env
    healthcheck:
      # $$ para o shell do container expandir em tempo de execucao (e nao o
      # compose, que nao teria POSTGRES_* no .env do projeto).
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
