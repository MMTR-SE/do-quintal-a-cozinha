services:
  dev-quintal:
    build:
      context: $PWD
      dockerfile: docker/desenvolvimento/Dockerfile
    env_file:
      - $PWD/.env
    ports:
      - "3001:3000"
    volumes:
      - $PWD:/app
      - /app/node_modules
      # Build do Next fica só no container (evita arquivos de root/nobody no .next do host)
      - /app/.next
      - ./docker/desenvolvimento/certificates:/app/certificates
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true  # Enable polling for hot reload in Docker
      - NEXT_PUBLIC_STRAPI_URL=http://cms:1337
      # Dentro do container o banco atende em "postgres" (o .env aponta para localhost)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-quintal}:${POSTGRES_PASSWORD:-quintal}@postgres:5432/${POSTGRES_DB:-quintal}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      cms:
        condition: service_started
    restart: unless-stopped
    networks:
      - app_network

  postgres:
    container_name: postgres
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - $PWD/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - app_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quintal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quintal}
      POSTGRES_DB: ${POSTGRES_DB:-quintal}
      TZ: ${TZ:-America/Maceio}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quintal} -d ${POSTGRES_DB:-quintal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cms:
    build:
      context: $PWD
      dockerfile: docker/cms/Dockerfile
    # Pega API_KEY/STRAPI_API_TOKEN do .env (o DATABASE_URL abaixo sobrescreve)
    env_file:
      - $PWD/.env
    ports:
      - "1337:1337"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-quintal}:${POSTGRES_PASSWORD:-quintal}@postgres:5432/quintal_cms?schema=public
      # Ao publicar no CMS, avisa o site para sincronizar com o Postgres
      SITE_SYNC_URL: http://dev-quintal:3000
      APP_KEYS: ${CMS_APP_KEYS:-dev-key-1,dev-key-2}
      API_TOKEN_SALT: ${CMS_API_TOKEN_SALT:-dev-api-token-salt}
      ADMIN_JWT_SECRET: ${CMS_ADMIN_JWT_SECRET:-dev-admin-jwt-secret}
      TRANSFER_TOKEN_SALT: ${CMS_TRANSFER_TOKEN_SALT:-dev-transfer-token-salt}
      JWT_SECRET: ${CMS_JWT_SECRET:-dev-jwt-secret}
      ENCRYPTION_KEY: ${CMS_ENCRYPTION_KEY:-dev-encryption-key}
    volumes:
      - cms_data:/app/.tmp
      - cms_uploads:/app/public/uploads
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  typebot-builder:
    image: baptistearno/typebot-builder:latest
    restart: unless-stopped
    ports:
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy
      typebot-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quintal}:${POSTGRES_PASSWORD:-quintal}@postgres:5432/typebot
      REDIS_URL: redis://typebot-redis:6379
      NEXTAUTH_URL: ${TYPEBOT_NEXTAUTH_URL:-http://localhost:3002}
      NEXTAUTH_URL_INTERNAL: http://typebot-builder:3000
      NEXT_PUBLIC_VIEWER_URL: ${TYPEBOT_VIEWER_URL:-http://localhost:3003}
      ENCRYPTION_SECRET: ${TYPEBOT_ENCRYPTION_SECRET:-typebot-dev-enc-secret-123456789}
      # SMTP do Mailpit (dev) para os e-mails de magic link de login
      # Atenção: versões atuais do Typebot usam SMTP_HOST/PORT (não SMTP_URL)
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: typebot
      SMTP_PASSWORD: typebot
      SMTP_SECURE: "false"
      SMTP_IGNORE_TLS: "true"
      SMTP_FROM: "Typebot <typebot@quintal.local>"
      NEXT_PUBLIC_SMTP_FROM: "Typebot <typebot@quintal.local>"
      # Os fluxos do projeto usam bloco de upload de arquivo, que o plano FREE
      # nao deixa publicar ("File upload blocks can't be published on the free
      # plan"). No self-host isso e configuracao: ADMIN_EMAIL ganha UNLIMITED e
      # DEFAULT_WORKSPACE_PLAN vale para workspaces novos.
      ADMIN_EMAIL: ${TYPEBOT_ADMIN_EMAIL:-admin@quintal.local}
      DEFAULT_WORKSPACE_PLAN: ${TYPEBOT_DEFAULT_PLAN:-UNLIMITED}
      NODE_OPTIONS: --no-node-snapshot
    networks:
      - app_network

  typebot-viewer:
    image: baptistearno/typebot-viewer:latest
    restart: unless-stopped
    ports:
      - "3003:3000"
    depends_on:
      postgres:
        condition: service_healthy
      typebot-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quintal}:${POSTGRES_PASSWORD:-quintal}@postgres:5432/typebot
      REDIS_URL: redis://typebot-redis:6379
      NEXTAUTH_URL: ${TYPEBOT_NEXTAUTH_URL:-http://localhost:3002}
      NEXTAUTH_URL_INTERNAL: http://typebot-viewer:3000
      NEXT_PUBLIC_VIEWER_URL: ${TYPEBOT_VIEWER_URL:-http://localhost:3003}
      ENCRYPTION_SECRET: ${TYPEBOT_ENCRYPTION_SECRET:-typebot-dev-enc-secret-123456789}
      NODE_OPTIONS: --no-node-snapshot
    networks:
      - app_network

  typebot-redis:
    image: redis:alpine
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    networks:
      - app_network

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"   # Interface web do Mailpit (e-mails de login do Typebot)
      - "1025:1025"   # SMTP
    networks:
      - app_network

  # ---------------------------------------------------------------------------
  # Evolution API: liga um numero de WhatsApp (Baileys) aos fluxos do Typebot
  # que rodam na sua maquina. Serve para testar os fluxos com um numero de
  # verdade, localmente -- nada disso sobe para a VPS.
  # Passo a passo: docker/desenvolvimento/TYPEBOT-WHATSAPP.md
  # ---------------------------------------------------------------------------
  evolution-redis:
    container_name: evolution-redis
    image: redis:alpine
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    volumes:
      - evolution_redis_data:/data
    networks:
      - app_network

  evolution-api:
    container_name: evolution-api
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      # Chave usada nas chamadas (o script le direto do container)
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-quintal-evolution-dev}
      LANGUAGE: pt-BR
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-quintal}:${POSTGRES_PASSWORD:-quintal}@postgres:5432/evolution?schema=evolution_api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      # Nome que aparece no aparelho conectado
      CONFIG_SESSION_PHONE_CLIENT: Quintal (dev)
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN
      LOG_BAILEYS: error
      # Integracao com o Typebot: a Evolution chama o viewer pela rede interna
      TYPEBOT_ENABLED: "true"
      TYPEBOT_API_VERSION: latest
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started

  # Interface web da Evolution (opcional, so para ver QR/status pelo navegador)
  evolution-manager:
    container_name: evolution-manager
    image: evoapicloud/evolution-manager:latest
    restart: unless-stopped
    ports:
      - "8180:80"
    volumes:
      # A imagem oficial vem com um nginx.conf invalido (`gzip_proxied ...
      # must-revalidate`), entao o nginx nao sobe; montamos o arquivo corrigido.
      - ./evolution-manager-nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
    networks:
      - app_network
    depends_on:
      - evolution-api

networks:
  app_network:
    driver: bridge

volumes:
  cms_data:
  cms_uploads:
  evolution_instances:
  evolution_redis_data:
  postgres_data:
  redis_data:
