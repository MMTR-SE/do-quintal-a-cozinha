services:
  pre-quintal:
    container_name: pre-quintal
    build:
      context: $DEV_PATH
      dockerfile: $DEV_PATH/docker/pre-producao/Dockerfile
      args:
        NEXT_PUBLIC_STRAPI_URL: https://conteudo.mulheresrurais.com.br
    env_file:
      - $DEV_PATH/.env
    environment:
      NEXT_PUBLIC_STRAPI_URL: https://conteudo.mulheresrurais.com.br
    depends_on:
      - pre-quintal-cms
    ports:
      - "82:3000"
    restart: unless-stopped
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - $DEV_PATH/prisma:/app/prisma

  pre-quintal-cms:
    container_name: pre-quintal-cms
    build:
      context: $DEV_PATH
      dockerfile: $DEV_PATH/docker/cms/Dockerfile
    env_file:
      - $DEV_PATH/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: https://conteudo.mulheresrurais.com.br
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db
    ports:
      - "127.0.0.1:1337:1337"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - $DEV_PATH/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - app_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quintal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quintal}
      POSTGRES_DB: ${POSTGRES_DB:-quintal}
      TZ: ${TZ:-America/Maceio}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quintal} -d ${POSTGRES_DB:-quintal}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
